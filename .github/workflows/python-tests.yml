name: Q2 Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install coverage
        run: pip install coverage

      - name: Run Q2 tests with coverage
        working-directory: Q2
        run: |
          coverage run -m unittest -v CalcTest.py
          coverage report -m